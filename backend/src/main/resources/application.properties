spring.application.name=agentflow-backend
spring.datasource.url=jdbc:mysql://localhost:3306/agentflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=agentflow
spring.datasource.password=agentflow_dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
rocketmq.name-server=127.0.0.1:9876
rocketmq.producer.group=agentflow-run-producer
spring.ai.model.chat=openai
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL:gpt-5-mini}
spring.ai.model.embedding=openai
spring.ai.openai.embedding.base-url=${EMBEDDING_BASE_URL:${AI_BASE_URL:https://api.openai.com}}
spring.ai.openai.embedding.api-key=${EMBEDDING_API_KEY:${AI_API_KEY:}}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.retry.max-attempts=1
spring.ai.chat.client.tool-calling.enabled=true
spring.ai.tools.throw-exception-on-error=true
search.api.base-url=${SEARCH_API_BASE_URL:https://api.tavily.com}
search.api.key=${SEARCH_API_KEY:}
rag.datasource.url=${RAG_DB_URL:jdbc:postgresql://localhost:5432/agentflow_rag}
rag.datasource.username=${RAG_DB_USERNAME:agentflow_rag}
rag.datasource.password=${RAG_DB_PASSWORD:agentflow_rag_dev}
rag.datasource.driver-class-name=org.postgresql.Driver
