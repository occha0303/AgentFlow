services:
  mysql:
    image: mysql:8.4
    container_name: agentflow-mysql
    environment:
      MYSQL_DATABASE: agentflow
      MYSQL_USER: agentflow
      MYSQL_PASSWORD: agentflow_dev
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - agentflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 12

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.2
    container_name: agentflow-rocketmq-nameserver
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: agentflow-rocketmq-broker
    # Docker creates a new named volume as root; the broker must initialize its store there.
    user: "0:0"
    depends_on:
      rocketmq-nameserver:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker -n rocketmq-nameserver:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - agentflow-rocketmq-data:/home/rocketmq/store

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: agentflow-pgvector
    environment:
      POSTGRES_DB: agentflow_rag
      POSTGRES_USER: agentflow_rag
      POSTGRES_PASSWORD: agentflow_rag_dev
    ports:
      - "5432:5432"
    volumes:
      - agentflow-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow_rag -d agentflow_rag"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2.10-alpine
    container_name: agentflow-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --save "" --appendonly no;
      fi'
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  agentflow-mysql-data:
  agentflow-rocketmq-data:
  agentflow-pgvector-data:
