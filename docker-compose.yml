services:
  mysql:
    image: mysql:8.4
    container_name: agentflow-mysql
    environment:
      MYSQL_DATABASE: agentflow
      MYSQL_USER: agentflow
      MYSQL_PASSWORD: agentflow_dev
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - agentflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 12

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.2
    container_name: agentflow-rocketmq-nameserver
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: agentflow-rocketmq-broker
    # Docker creates a new named volume as root; the broker must initialize its store there.
    user: "0:0"
    depends_on:
      rocketmq-nameserver:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker -n rocketmq-nameserver:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - agentflow-rocketmq-data:/home/rocketmq/store

volumes:
  agentflow-mysql-data:
  agentflow-rocketmq-data:
