# Keep the image's essential single-broker defaults when overriding broker.conf.
brokerClusterName=DefaultCluster
brokerName=agentflow-broker
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# The host-side Spring Boot client receives this address from NameServer.
# Docker Desktop exposes the broker remoting port on the Windows host.
brokerIP1=127.0.0.1
listenPort=10911
storePathRootDir=/home/rocketmq/store

# Convenient for the first local-development topic; production should manage topics explicitly.
autoCreateTopicEnable=true
